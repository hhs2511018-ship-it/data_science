let cur="fit",data={},cnt=0,runs=[];
const $=s=>document.querySelector(s),sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};
const norm=c=>c.split("\n").map(l=>l.replace(/#.*$/,"")).join("\n").replace(/["“”‘’]/g,"'").replace(/\s+/g,"");
function head(r){const f=r.meta.fields,rows=r.data.slice(0,5);return `<div class="tb"><table><tr><th></th>${f.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map((x,i)=>`<tr><th>${i}</th>${f.map(k=>`<td>${x[k]===""||x[k]==null?"NaN":x[k]}</td>`).join("")}</tr>`).join("")}</table></div>`}
function render(){const L=$("#list");L.innerHTML="";runs=[];cnt=0;
 S[cur].forEach((q,i)=>{const id=cur+i,d=document.createElement("div");d.className="nb";
  d.innerHTML=`<div class="h">${i+1}. ${q.t}</div><div class="pr">${q.p}</div>
  <div class="row"><span class="lab">In [ ]:</span><div class="ed"><div class="gut">1</div><textarea readonly spellcheck="false" rows="3"></textarea></div></div>
  <div class="out"></div><div class="ans"><a>정답·설명 보기</a></div>`;
  const ta=d.querySelector("textarea"),g=d.querySelector(".gut"),lab=d.querySelector(".lab"),out=d.querySelector(".out");
  const fit=()=>{const n=Math.max(3,ta.value.split("\n").length);ta.rows=n;g.textContent=Array.from({length:n},(_,k)=>k+1).join("\n")};
  ta.value=ld("n"+id);fit();
  ta.ondblclick=()=>{ta.readOnly=false;ta.focus()};
  ta.oninput=()=>{sv("n"+id,ta.value);fit()};
  ta.onblur=()=>{ta.readOnly=true};
  const run=()=>{if(!ta.value.trim()){out.innerHTML="";return}cnt++;lab.textContent=`In [${cnt}]:`;
   const n=norm(ta.value);let ok=0;
   const rows=q.c.map(([l,r])=>{const p=new RegExp(r).test(n);if(p)ok++;return `<div class="${p?"ok":"no"}">${p?"✔":"✘"} ${l}</div>`}).join("");
   out.innerHTML=`<div><span class="o">Out:</span> <b>${ok}/${q.c.length}</b> ${ok===q.c.length?"완벽해요 🎉":"충족"}</div>${rows}${q.show&&data[cur]&&ok===q.c.length?head(data[cur]):""}`};
  ta.onkeydown=e=>{if(e.key==="Tab"&&!ta.readOnly){e.preventDefault();ta.setRangeText("    ",ta.selectionStart,ta.selectionEnd,"end");ta.oninput()}if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();run()}};
  d.querySelector(".ans a").onclick=()=>{const p=d.querySelector(".sol");if(p){p.remove();return}const x=document.createElement("pre");x.className="sol";x.textContent=q.a;d.querySelector(".ans").appendChild(x)};
  runs.push(run);L.appendChild(d)})}
$("#all").onclick=()=>{cnt=0;runs.forEach(r=>r())};
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-s]").forEach(x=>x.classList.remove("on"));b.classList.add("on");cur=b.dataset.s;render()});
document.querySelectorAll(".file input").forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const buf=await f.arrayBuffer();let t;try{t=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){t=new TextDecoder("euc-kr").decode(buf)}
 data[inp.dataset.k]=Papa.parse(t,{header:true,skipEmptyLines:true});$("#fs").textContent=" ✔ "+f.name+" ("+data[inp.dataset.k].data.length+"행)"});
render();
</script></body></html>
